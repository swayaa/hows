# Windows-Build: NSIS, MSI, portables ZIP und die WiX-UIExtension-Quelle als Artifact.
# Die lose hows.exe ist ein Build-Ergebnis und keine veröffentlichte Verteilung.
#
# Auslöser:
#   - Tag `v*` → Artifact + GitHub-Release-Entwurf mit den Bundles
#   - workflow_dispatch → nur Artifact (kein Release nötig)
#
# Artifacts erscheinen unter: Actions → Release → (Run) → Artifacts → windows-installers
#
# TODO(signing): Azure Trusted Signing (Spec §9) — ohne Signatur warnt
#   SmartScreen. Secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.
# TODO(updater): TAURI_SIGNING_PRIVATE_KEY, sobald Auto-Updater aktiviert wird.
# TODO(winget): Publish nach stabilem Release-Prozess.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Frontend-Abhängigkeiten
        working-directory: app
        run: npm ci

      - name: Tauri-Build (NSIS + MSI + EXE)
        working-directory: app
        run: npm run tauri build

      # NSIS und MSI legen LICENSE und THIRD-PARTY-NOTICES.md über
      # bundle.resources neben hows.exe. Die portable Verteilung ist das ZIP.
      - name: Portables ZIP packen
        shell: pwsh
        run: ./scripts/release/pack-portable.ps1

      - name: WiX-UIExtension-Quelle holen
        shell: pwsh
        run: ./scripts/release/fetch-wix-uiextension.ps1

      - name: Build-Outputs prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nsis = @(Get-ChildItem -Path "app/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          $msi  = @(Get-ChildItem -Path "app/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue)
          $portable = @(Get-ChildItem -Path "app/src-tauri/target/release/bundle/Hows_*_x64-portable.zip" -ErrorAction SilentlyContinue)
          $wix = Get-Item -Path "app/src-tauri/target/release/bundle/wix-UIExtension-wix3141rtm.zip" -ErrorAction SilentlyContinue
          if ($nsis.Count -lt 1) { throw "NSIS-Installer fehlt unter bundle/nsis/" }
          if ($msi.Count -lt 1)  { throw "MSI fehlt unter bundle/msi/" }
          if ($portable.Count -ne 1) { throw "Genau ein portables ZIP erwartet, gefunden: $($portable.Count)" }
          if (-not $wix) { throw "WiX-UIExtension-Archiv fehlt." }
          $zip = [IO.Compression.ZipFile]::OpenRead($portable[0].FullName)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            $licenseEntry = $zip.GetEntry('LICENSE')
            if (-not $licenseEntry) { throw 'Portables ZIP enthält keine LICENSE.' }
            $reader = New-Object IO.StreamReader($licenseEntry.Open())
            try { $licenseText = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $expected = @('hows.exe', 'LICENSE', 'THIRD-PARTY-NOTICES.md')
          if (Compare-Object $expected $names) { throw "Portables ZIP enthält $($names -join ', ')" }
          if ($licenseText -notmatch 'Copyright \(c\) 2026 Hows contributors') { throw 'LICENSE im ZIP nennt nicht die Hows contributors.' }
          if ($licenseText -match 'Copyright \(c\) 2026 swaya') { throw 'LICENSE im ZIP ist die leere Platzhalter-Lizenz.' }
          $wixZip = [IO.Compression.ZipFile]::OpenRead($wix.FullName)
          try { $wixNames = @($wixZip.Entries | ForEach-Object { $_.FullName }) } finally { $wixZip.Dispose() }
          if ($wixNames -notcontains 'LICENSE.TXT') { throw 'WiX-Archiv ohne LICENSE.TXT.' }
          if (-not ($wixNames | Where-Object { $_ -like 'UIExtension/*' })) { throw 'WiX-Archiv ohne UIExtension-Quelle.' }
          Write-Host "NSIS:" ($nsis | ForEach-Object FullName)
          Write-Host "MSI:" ($msi | ForEach-Object FullName)
          Write-Host "Portable:" $portable[0].FullName
          Write-Host "WiX:" $wix.FullName

      - name: Windows-Artifacts hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          retention-days: 14
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/Hows_*_x64-portable.zip
            app/src-tauri/target/release/bundle/wix-UIExtension-wix3141rtm.zip

      - name: GitHub-Release-Entwurf (nur Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          name: "Hows ${{ github.ref_name }}"
          body: |
            Unsignierte Windows-Installer (Signing folgt).

            Auch als Workflow-Artifact `windows-installers` unter dem Release-Run verfügbar
            (Actions → Release → Artifacts).
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/Hows_*_x64-portable.zip
            app/src-tauri/target/release/bundle/wix-UIExtension-wix3141rtm.zip
