name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Kern-Crates: fmt, clippy (-D warnings), test — auf Linux UND Windows.
  # Der Windows-Runner ist die Wahrheitsinstanz für den cfg(windows)-Code.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: cargo fmt --check
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path core/Cargo.toml --workspace

  # Tauri-App: Frontend-Build + Backend-Checks — auf Linux UND Windows.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tauri-Systemabhängigkeiten (nur Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Frontend-Build
        working-directory: app
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: cargo fmt --check (Backend)
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check

      - name: cargo clippy (Backend)
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (Backend)
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Lizenzinventar gegen Notices
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-msvc
          node scripts/licenses/check-notices.mjs

  # Doku: jede Seite auf Englisch und Deutsch, mit Sprachzeile oben.
  docs-languages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Sprachpaare und Sprachzeilen
        run: node scripts/docs/check-languages.mjs

  # Doku: relative Links und Anker lösen auf, keine verwaisten Seiten.
  # Externe Links werden nicht abgerufen.
  docs-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Relative Links und Anker
        run: node scripts/docs/check-links.mjs

  # Doku: Rechtschreibung mit cspell, Englisch und Deutsch, plus Projektwörterbuch.
  docs-spelling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/docs/package-lock.json

      - name: cspell installieren
        working-directory: scripts/docs
        run: npm ci

      - name: Rechtschreibung
        run: node scripts/docs/check-spelling.mjs

  # Doku: markierte Werte (Standards, Grenzen, Hotkeys, Texte, Fehlermeldungen)
  # stimmen mit dem Code überein. Liest die Locale-Dateien der App per
  # TypeScript-Type-Stripping, braucht also Node 22.18 oder neuer.
  docs-facts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Werte in der Doku gegen den Code
        run: node scripts/docs/check-facts.mjs

  # Neuester Rust-Stable, nur Kompilieren. rustfmt und clippy bleiben bei 1.88.0.
  stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tauri-Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            core
            app/src-tauri

      - name: Frontend für das Tauri-Buildskript
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: cargo check (core)
        run: cargo check --locked --manifest-path core/Cargo.toml

      - name: cargo check (Tauri-Backend)
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml
