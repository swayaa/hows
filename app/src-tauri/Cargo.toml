[package]
name = "hows"
description = "Hows – local-first step recorder (Tauri backend)"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/swayaa/hows"
rust-version = "1.88"

[lib]
name = "hows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native file picker only — do not use tauri-plugin-dialog: its init script
# replaces window.confirm with an async stub and breaks Annotate clear-marks.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
steps-capture = { path = "../../core/capture" }
steps-i18n = { path = "../../core/i18n" }
steps-session = { path = "../../core/session" }
steps-store = { path = "../../core/store" }
steps-export = { path = "../../core/export" }

[target.'cfg(windows)'.dependencies]
# Gleiche Version wie Tauri, damit HWND zum ShowWindow ohne Fokus passt.
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
