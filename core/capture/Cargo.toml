[package]
name = "steps-capture"
description = "Input-Hooks, Screenshots und Element-Inspektion hinter OS-neutralen Traits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"] }
uiautomation = "0.25.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
xcap = "0.9.8"
